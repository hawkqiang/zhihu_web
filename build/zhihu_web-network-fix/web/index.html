<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>zhihu_web</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">知</span>
        <span class="brand-text">知乎<b>--</b><small>web</small></span>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" data-route="hot" href="#/hot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
          <span>热榜</span>
        </a>
        <a class="nav-item" data-route="recommend" href="#/recommend">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18" stroke-width="2" fill="none" stroke="currentColor"/></svg>
          <span>推荐</span>
        </a>
        <a class="nav-item" data-route="following" href="#/following">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9a8 8 0 0 1 16 0Z"/></svg>
          <span>关注</span>
        </a>
        <a class="nav-item" data-route="history" href="#/history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" stroke-width="2" fill="none" stroke="currentColor" stroke-linecap="round"/></svg>
          <span>历史</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <a class="nav-item" data-route="settings" href="#/settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m19 12 2 1.5-2 3.5-2.5-1-2 1-.5 2.5h-4L9.5 17l-2-1-2.5 1-2-3.5L5 12 3 10.5 5 7l2.5 1 2-1L10 4.5h4L14.5 7l2 1L19 7l2 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>设置</span>
        </a>
        <button class="account" id="account" type="button">
          <span class="avatar" id="avatar">访</span>
          <span class="account-text">
            <b id="accountName">未登录</b>
            <small id="accountHint">点击登录知乎</small>
          </span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn back" id="back" type="button" title="返回" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="crumb" id="crumb">热榜</h1>
        <form class="search" id="searchForm" autocomplete="off">
          <input id="searchInput" type="search" placeholder="搜索知乎内容" enterkeyhint="search">
          <button type="submit" class="search-btn" title="搜索">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </form>
        <button class="icon-btn" id="themeBtn" type="button" title="切换深色模式">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="icon-btn" id="browserBtn" type="button" title="在内置浏览器中打开知乎">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9h16" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </header>

      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/md5.js"></script>
  <script src="js/zse96.js"></script>
  <script src="js/store.js"></script>
  <script src="js/host.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
